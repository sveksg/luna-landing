<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ИИ-психолог в Telegram — выслушает и поддержит | Луна</title>

  <!-- Open Graph / Telegram / соцсети -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ИИ-психолог в Telegram — выслушает и поддержит | Луна" />
  <meta property="og:description" content="Выслушает и поможет справиться с тревогой, расставанием, выгоранием и одиночеством. Когда накрывает или не с кем поговорить. Анонимно, 24/7, первое бесплатно" />
  <meta property="og:image" content="assets/girl.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #100E24;
      --accent: #C5B8FE;
      --chip-bg: #E9DEF8;
      --chip-text: #282828;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      background: var(--bg);
      padding: clamp(24px, 4vw, 80px) 80px;
      display: flex;
      justify-content: center;
    }

    .hero__card {
      position: relative;
      width: 100%;
      max-width: 1580px;
      display: flex;
      align-items: stretch;
      gap: clamp(16px, 2vw, 40px);
      overflow: hidden;
      border-radius: clamp(28px, 6vw, 116px);
      background: linear-gradient(180deg, #1F1A33 0%, #26223F 45%, #1D1831 100%);
      --card-h: clamp(540px, 42vw, 620px);
      height: var(--card-h);
    }

    /* ---------- Text column ---------- */
    .hero__text {
      position: relative;
      z-index: 2;
      flex: 1 1 52%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: clamp(28px, 3.4vw, 48px);
      padding: clamp(40px, 4.6vw, 88px) clamp(24px, 3.2vw, 55px);
    }

    .hero__head {
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 1.6vw, 23px);
    }

    .hero__title {
      color: #fff;
      font-weight: 700;
      font-size: clamp(26px, 3.3vw, 46px);
      line-height: 1.29;
      letter-spacing: -0.01em;
    }
    .hero__title .accent { color: var(--accent); }

    .hero__tags {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(8px, 0.8vw, 11.5px);
    }
    .hero__tag {
      background: var(--chip-bg);
      color: var(--chip-text);
      font-weight: 500;
      font-size: clamp(13px, 1.2vw, 17.24px);
      line-height: 1;
      padding: clamp(11px, 1vw, 15.3px) clamp(13px, 1.1vw, 16px);
      border-radius: clamp(11px, 1vw, 15.3px);
      white-space: nowrap;
    }

    .hero__subtitle {
      color: #fff;
      font-weight: 500;
      font-size: clamp(15px, 1.45vw, 21px);
      line-height: 1.27;
      opacity: 0.95;
    }

    .hero__cta {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: clamp(8px, 0.7vw, 10px);
      background: #fff;
      color: #060606;
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      padding: clamp(12px, 1vw, 14px) clamp(12px, 1vw, 14px) clamp(12px, 1vw, 14px) clamp(18px, 1.7vw, 24px);
      border-radius: 46px;
      box-shadow: 0 0 24px rgba(255, 236, 236, 0.39);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .hero__cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 34px rgba(255, 236, 236, 0.55);
    }
    .hero__cta svg {
      width: clamp(30px, 2.7vw, 39px);
      height: clamp(30px, 2.7vw, 39px);
      display: block;
      flex-shrink: 0;
    }

    /* ---------- Media column ---------- */
    .hero__media {
      position: relative;
      flex: 1 1 48%;
      align-self: stretch;
    }
    .hero__media img { display: block; }

    /* Girl photo (transparent) + soft blur glow behind it,
       bottom pinned to the bottom of the card. */
    .hero__figure {
      position: absolute;
      bottom: 0;
      right: calc(var(--card-h) * 0.489 - 47px);
      height: calc(var(--card-h) * 0.88);
      aspect-ratio: 445 / 618;
      z-index: 1;
    }
    .hero__glow {
      position: absolute;
      z-index: -1;
      left: 50%;
      top: 50%;
      width: 158%;
      height: auto;
      transform: translate(-50%, -46%);
      pointer-events: none;
    }
    .hero__girl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }
    .hero__chat {
      position: absolute;
      z-index: 2;
      bottom: 6%;
      right: 0;
      height: 72%;
      width: auto;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    /* ---------- Tablet / Mobile: stacked ---------- */
    @media (max-width: 900px) {
      .hero {
        padding-left: clamp(16px, 4vw, 40px);
        padding-right: clamp(16px, 4vw, 40px);
      }
      .hero__card {
        flex-direction: column;
        gap: clamp(24px, 5vw, 40px);
        height: auto;
      }
      .hero__text {
        flex: none;
        width: 100%;
        max-width: none;
        padding: clamp(28px, 6vw, 48px) clamp(20px, 6vw, 44px) 0;
      }
      .hero__cta { align-self: stretch; justify-content: center; }

      .hero__media {
        flex: none;
        width: 100%;
        align-self: auto;
        height: clamp(340px, 92vw, 500px);
      }
      .hero__figure { left: 0; right: auto; height: 100%; }
      .hero__chat {
        right: 3%;
        bottom: 3%;
        height: 82%;
      }
    }

    @media (max-width: 420px) {
      .hero {
        padding-left: 10px;
        padding-right: 10px;
      }
      .hero__chat { right: 0; height: 76%; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__card">
      <div class="hero__text">
        <div class="hero__head">
          <h1 class="hero__title">
            ИИ-психолог в Telegram выслушает в <span class="accent">трудный момент</span> и поможет <span class="accent">выбраться из кризиса</span>
          </h1>

          <div class="hero__tags">
            <span class="hero__tag">Расставание</span>

            <span class="hero__tag">Одиночество</span>
          </div>

          <p class="hero__subtitle">Живой диалог по научному подходу — анонимно</p>
        </div>

          </svg>

      </div>

      <div class="hero__media">
        <div class="hero__figure">
          <img class="hero__glow" src="assets/glow.svg" alt="" aria-hidden="true" />

        </div>
        <img class="hero__chat" src="assets/chat.png" alt="Диалог с Луной в Telegram" />

    </div>
  </section>
</body>
</html>
